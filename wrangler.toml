# Anime Exchange Bot — Cloudflare Workers (designed for the Workers Free plan, spec §2.4)
name = "anime-exchange-bot"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# ---------------------------------------------------------------------------
# Non-secret config. Secrets are set with `wrangler secret put`:
#   DISCORD_TOKEN, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, TOKEN_ENC_KEY,
#   MAL_CLIENT_ID, DIAG_KEY
# (TOKEN_ENC_KEY = 32 random bytes, base64 — e.g. `openssl rand -base64 32`)
# (DIAG_KEY      = any random string; leave unset to disable /diag/search)
# ---------------------------------------------------------------------------
[vars]
DISCORD_APP_ID = "1533788885727838288"
DISCORD_PUBLIC_KEY = "8122b26bc189196dfb62735ee7453de419155ed0c719506dc3f2e15f4ab70a87"
# Must exactly match an authorized redirect URI on the Google OAuth client:
GOOGLE_REDIRECT_URI = "https://anime-exchange-bot.jaejunghaa.workers.dev/google/oauth/callback"
MAX_PARTICIPANTS = "100"
# Fan-out units per cron tick (spec §7.4). The spec's sample env says 6; the
# default here is 5 because a launch unit costs ~7 external subrequests
# (docs.create, template batchUpdate, text export, permission, thread create,
# add member, card post) and D1 ops may also count toward the free plan's
# 50-subrequest cap (spec §2.4 [verify]). 5 keeps the worst-case tick ≈ 40
# with headroom. On the paid plan, raise it freely.
JOB_BATCH = "5"
REMINDERS_PER_TICK = "30"
SFW_ONLY = "true"
# MAL_CLIENT_ID is a SECRET — set it with `wrangler secret put MAL_CLIENT_ID`,
# never here. It is account-bound and quota-limited: anyone holding it can
# spend the quota, and the throttling surfaces as "search unavailable" in
# every guild. (It lived in this file until v7.1; rotate any id that was.)
#
# Effectively REQUIRED for reliable search on Workers. Jikan (the only
# fallback) sits behind Cloudflare bot protection that routinely 403s Workers
# egress traffic; the authenticated official API is not subject to that. Get
# one free in ~2 minutes: https://myanimelist.net/apiconfig ("Create ID", app
# type: other).

[[d1_databases]]
binding = "DB"
database_name = "anime-exchange"
database_id = "d1979187-f851-4749-a40b-6986c55cb86b"
migrations_dir = "migrations"

[triggers]
# Single minute schedule; the dispatcher gates by clock (spec §10.3).
crons = ["* * * * *"]
